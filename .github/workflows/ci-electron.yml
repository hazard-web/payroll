# Lightweight check on PRs into `electron`. Installers are built by Deploy Pulse Timer.

name: CI electron (Pulse Timer)

on:
  pull_request:
    branches: [electron]
  workflow_dispatch:

concurrency:
  group: ci-electron
  cancel-in-progress: true

jobs:
  desktop:
    name: Check Pulse Timer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node -e "require('./package.json')"
      - name: Confirm local bridge port
        run: grep -q 'BRIDGE_PORT = 39217' main.js
