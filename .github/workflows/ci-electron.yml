# Pulse Timer (Electron) — local desktop app, not Vercel/Hostinger.
# Local bridge: http://127.0.0.1:39217  (not a public port)
# Web app stays on Vite :3001 and API :5001.
#
# Work on the `electron` branch. Merge into development when the timer
# should ship with the rest of People OS. No UAT/production deploy.

name: CI electron (Pulse Timer)

on:
  push:
    branches: [electron]
  pull_request:
    branches: [electron]
  workflow_dispatch:

concurrency:
  group: ci-electron
  cancel-in-progress: true

jobs:
  desktop:
    name: Check Pulse Timer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node -e "require('./package.json')"
      - name: Confirm local bridge port
        run: grep -q 'BRIDGE_PORT = 39217' main.js
